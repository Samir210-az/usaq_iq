let popupShown = false;

function render(){
  if(appMode==='games'){ renderGamesApp(); return; }
  if(appMode==='coloring'){ renderColoringApp(); return; }
  if(appMode==='funnel' && themeDetail){ renderThemeDetail(); return; }
  const app = document.getElementById('app');
  app.innerHTML = '';
  const s = state.screen;

  const wrap = document.createElement('div');
  wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.flex='1';

  // TOPBAR
  const top = document.createElement('div');
  top.className='topbar';
  top.innerHTML = `${s>0?'<div class="back-btn" onclick="goBack()">←</div>':''}
    ${renderLogoHTML()}`;
  wrap.appendChild(top);

  // STEPPER (only during quiz phase)
  const INTRO_COUNT = 9;
  const quizStart=INTRO_COUNT+2, quizEnd = quizStart+QUIZ_LEN-1;
  const currentSet = QUESTION_SETS[state.age] || QUESTION_SETS['1–2'];
  if(s>=quizStart && s<=quizEnd){
    const qIdx = s-quizStart;
    const totalSteps = 5;
    const activeStep = Math.min(totalSteps-1, Math.floor(qIdx/(QUIZ_LEN/totalSteps)));
    const st = document.createElement('div'); st.className='stepper';
    for(let i=0;i<totalSteps;i++){
      const d=document.createElement('div');
      d.className='dot'+(i<activeStep?' done':(i===activeStep?' now':''));
      d.innerText = i<activeStep?'✓':'';
      st.appendChild(d);
      if(i<totalSteps-1){const l=document.createElement('div'); l.className='line'+(i<activeStep?' done':''); st.appendChild(l);}
    }
    wrap.appendChild(st);
    const lbl=document.createElement('div'); lbl.className='step-label';
    lbl.innerText = currentSet[qIdx].domain + ` · ${qIdx+1}/${QUIZ_LEN}`;
    wrap.appendChild(lbl);
  }

  // INTRO PROGRESS BAR (only for the 10 intro/marketing screens)
  if(s < INTRO_COUNT){
    const ip = document.createElement('div'); ip.className='intro-progress';
    ip.innerHTML = `<div class="intro-progress-fill" style="width:${((s+1)/INTRO_COUNT*100)}%"></div>`;
    wrap.appendChild(ip);
    const ipl = document.createElement('div'); ipl.className='intro-progress-lbl';
    ipl.innerText = `${s+1} / ${INTRO_COUNT}`;
    wrap.appendChild(ipl);
  }

  const scr = document.createElement('div');
  scr.className='screen';
  if(s < INTRO_COUNT){
    const themes = ['t-teal','t-gold','t-coral','t-bordo'];
    scr.classList.add(themes[s % themes.length]);
  }

  // ===== SCREEN ROUTER =====
  // --- 9 tanıtım (intro) ekranı — testdən ƏVVƏL ---
  if(s===0){ scr.appendChild(screenGet1()); }
  else if(s===1){ scr.appendChild(screenGet2()); }
  else if(s===2){ scr.appendChild(screenGet3()); }
  else if(s===3){ scr.appendChild(screenCertified()); }
  else if(s===4){ scr.appendChild(screenKidsLove()); }
  else if(s===5){ scr.appendChild(screenReviews()); }
  else if(s===6){ scr.appendChild(screenStressFree()); }
  else if(s===7){ scr.appendChild(screenThemes()); }
  else if(s===8){ scr.appendChild(screenHowItWorks()); }
  // --- Test fazası ---
  else if(s===INTRO_COUNT){ scr.appendChild(screenAge()); }
  else if(s===INTRO_COUNT+1){ scr.appendChild(screenGender()); }
  else if(s>=quizStart && s<=quizEnd){ scr.appendChild(screenQuiz(s-quizStart, currentSet)); }
  else if(s===quizEnd+1){ scr.appendChild(screenExpert()); }
  else if(s===quizEnd+2){ scr.appendChild(screenAnalysis()); }
  else if(s===quizEnd+3){ scr.appendChild(screenCreating()); }
  else { if(!state.tracked){ state.tracked = true; try { localStorage.removeItem('uiq_lead_sent'); } catch(e){} trackTestDone(); }
    app.innerHTML=''; app.appendChild(screenReport()); appendFooter(app); appendTabBar(app); return; }

  wrap.appendChild(scr);
  const f=document.createElement('footer');
  f.style.marginTop='auto';
  f.innerHTML = `<a href="https://aze-ai.az" target="_blank" rel="noopener" style="color:inherit; text-decoration:none;">By <strong style="color:var(--gold);">securtiy_group</strong></a><br><span style="font-size:.7rem; opacity:.7;">© 2026 Bütün hüquqlar qorunur.</span>`;
  wrap.appendChild(f);
  app.appendChild(wrap);
  appendTabBar(app);

  requestAnimationFrame(()=>{
    document.querySelectorAll('.skill-fill').forEach(f=>{ f.style.setProperty('--w', f.dataset.w+'%'); f.classList.add('in'); });
  });
}

function screenQuiz(i, set){
  window._currentSet = set;
  const q = set[i];
  const d=document.createElement('div');
  d.innerHTML = `<h1 class="q-title">${q.q}</h1>
  ${q.icon?`<div class="icon-3d">${q.icon}</div>`:''}

  <div class="answers-row">
    <div class="ans-btn ans-no" onclick="answer(false)"><span class="ic">✕</span>Xeyr</div>
    <div class="ans-btn ans-yes" onclick="answer(true)"><span class="ic">✓</span>Bəli</div>
  </div>`;
  return d;
}
function answer(v){
  const idx = state.answers.length;
  const domain = window._currentSet ? window._currentSet[idx].domain : 'Nitq';
  state.answers.push({domain, v});
  next();
}
function computeScores(){
  const totals = {}, yes = {};
  DOMAIN_ORDER.forEach(d=>{ totals[d]=0; yes[d]=0; });
  state.answers.forEach(a=>{ totals[a.domain]=(totals[a.domain]||0)+1; if(a.v) yes[a.domain]=(yes[a.domain]||0)+1; });
  const scores = {};
  DOMAIN_ORDER.forEach(d=>{ scores[d] = totals[d] ? Math.round(yes[d]/totals[d]*100) : 60; });
  return scores;
}

function trackTestDone(){
  const scores = computeScores();
  const vals = Object.values(scores);
  const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
  window.sgTrackTest && window.sgTrackTest('UşaqIQ İnkişaf Testi', 'Yaş: '+(state.age||'—')+' · Ortalama: '+avg+'%');
  window.sgTrackRecord && window.sgTrackRecord('Test tamamlandı','İstifadəçi', 'Yaş: '+(state.age||'—'));
}

let themeDetail = null;
function openThemeDetail(key){
  if(key==='art'){ switchTab('coloring'); return; }
  themeDetail = key;
  render();
}
function closeThemeDetail(){ themeDetail = null; render(); }

function playSongModal(idx){
  const song = MUSIC_DATA[idx];
  if(!song.vid) return;
  const ov = document.createElement('div');
  ov.className = 'video-overlay';
  ov.id = 'videoOverlay';
  ov.innerHTML = `<div class="video-modal">
    <div class="video-modal-head">
      <span>${song.title}</span>
      <span class="video-close" onclick="closeSongModal()">✕</span>
    </div>
    <div class="video-frame-wrap">
      <iframe src="https://www.youtube-nocookie.com/embed/${song.vid}?autoplay=1&rel=0" title="${song.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>`;
  ov.onclick = (e)=>{ if(e.target===ov) closeSongModal(); };
  document.body.appendChild(ov);
}
function closeSongModal(){
  const ov = document.getElementById('videoOverlay');
  if(ov) ov.remove();
}

function renderThemeDetail(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const top = document.createElement('div'); top.className='topbar';
  top.innerHTML = `<div class="back-btn" onclick="closeThemeDetail()">←</div>${renderLogoHTML()}`;
  app.appendChild(top);

  const scr = document.createElement('div'); scr.className='screen';
  const d = document.createElement('div');

  if(themeDetail==='numbers'){
    d.innerHTML = `<h1 class="headline">🔢 Rəqəmlər 1-10</h1>

    <div class="detail-grid">

    <div class="detail-grid detail-grid-3">

function normalizePhone(v){
  const d = String(v||'').replace(/\D/g,'');
  if(d.length===12 && d.indexOf('994')===0) return d;
  if(d.length===10 && d[0]==='0') return '994'+d.slice(1);
  if(d.length===9) return '994'+d;
  return null;
}

async function submitLead(){
  const err = document.getElementById('lfErr');
  const name = document.getElementById('lfName').value.trim();
  const phone = normalizePhone(document.getElementById('lfPhone').value);
  const child = document.getElementById('lfChild').value.trim();
  if(name.length < 2){ err.innerText = 'Adınızı yazın.'; return; }
  if(!phone){ err.innerText = 'Nömrəni düzgün yazın, məsələn 050 123 45 67.'; return; }
  if(!document.getElementById('lfConsent').checked){ err.innerText = 'Davam etmək üçün razılıq lazımdır.'; return; }
  const btn = document.getElementById('lfSend');
  btn.disabled = true; btn.innerText = 'Göndərilir...'; err.innerText = '';
  const sc = computeScores();
  const weak = DOMAIN_ORDER.filter(d=>sc[d]<60);
  try {
    if(!window.uiqLeads) throw new Error('offline');
    await window.uiqLeads.submit({ name:name, phone:phone, child:child, age:state.age||'', scores:sc, weak:weak.concat(['plan:'+planDuration]) });
    try { fetch('https://usaqiq-api.vercel.app/api/notify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name:name, child:child, age:state.age||'', phone:phone, plan:planDuration, overall:PLANS.overall(sc) }), keepalive:true }).catch(function(){}); } catch(e){}
    try { localStorage.setItem('uiq_lead_sent','1'); } catch(e){}
    window.sgTrackRecord && window.sgTrackRecord('Tam plan sorğusu','Valideyn','Yaş: '+(state.age||'—'));
    closeLeadForm();
    const pc = document.getElementById('planContent');
    if(pc) pc.innerHTML = renderPlanSection();
  } catch(e){
    btn.disabled = false; btn.innerText = 'Müraciət göndər';
    const msg = 'Salam! UşaqIQ testini keçdim və tam inkişaf planını pulsuz almaq istəyirəm. Yaş qrupu: ' + (state.age||'—') + '. Ad: ' + name + '.';
    err.innerHTML = 'Göndərmək alınmadı. <a href="https://wa.me/' + FALLBACK_WA + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener" style="color:#16a34a; font-weight:800;">WhatsApp ilə yazın</a>.';
  }
}

function renderPlanSection(){
  const age = currentReportAge();
  const scores = computeScores();
  const fr = PLANS.frame(age, scores);
  if(planDuration==='week'){
    const days = PLANS.week(age, scores);
    return frameBoxHTML(fr) + `<div class="plan-days-grid">${days.slice(0,FREE_DAYS).map(dayCardHTML).join('')}</div>` + planLockHTML(days.length-FREE_DAYS);
  }
  const weeks = PLANS.month(age, scores);
  const w = weeks[0];
  const total = weeks.reduce((n,x)=>n+x.days.length,0);
  return frameBoxHTML(fr) + `<div class="plan-week-block">
    <div class="plan-week-head">📅 ${w.weekNum}-ci həftə — ${w.stage}. Fokus: ${DOMAIN_ACTIVITIES[w.focusDomain].ic} ${w.focusDomain}</div>
    <p style="font-size:.85rem; color:var(--ink-soft); font-weight:700; margin:6px 0 10px;">${w.stageText}</p>
    <div class="plan-days-grid">${w.days.slice(0,FREE_DAYS).map(dayCardHTML).join('')}</div>
  </div>` + planLockHTML(total-FREE_DAYS);
}

function buildPlanDoc(o){
  const age = o.age, scores = o.scores, weakDomains = o.weak, duration = o.duration, full = o.full;
  const durLabel = {week:'Həftəlik', month:'Aylıq (4 həftə)'}[duration];
  const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const dayRow = d => `<div style="background:#fbf3e7; border-radius:12px; padding:16px; margin-bottom:12px; border-left:4px solid ${d.focus?'#F4A261':'#2A9D8F'};">
    <div style="font-weight:800; font-size:.85rem; color:#6A0000;">${d.ic} ${d.day}${d.special?' — '+d.special:''}</div>
    <div style="font-weight:800; font-size:1.05rem; margin-top:4px;">${d.activity}</div>
    <div style="color:#333; font-size:.9rem; margin-top:6px;"><b>Necə edilir:</b><ol style="margin:6px 0 0 18px; padding:0;">${(d.steps||[]).map(x=>'<li style="margin-bottom:4px;">'+x+'</li>').join('')}</ol></div>
    <div style="color:#2A9D8F; font-size:.85rem; margin-top:6px; font-style:italic;">💡 ${d.why}</div>
    ${d.sign?`<div style="color:#555; font-size:.88rem; margin-top:4px; background:#fff; padding:8px; border-radius:8px;"><b>İrəliləyiş göstəricisi:</b> ${d.sign}</div>`:''}
    ${d.up?`<div style="color:#555; font-size:.88rem; margin-top:4px; background:#fff; padding:8px; border-radius:8px;"><b>Növbəti addım:</b> ${d.up}</div>`:''}
  </div>`;
  const fr = PLANS.frame(age, scores);

  let planBody = '';
  if(duration==='week'){
    const wd = generateWeekPlan(age, weakDomains, scores);

async function sendLeadPlan(lead){
  const age = QUESTION_SETS[lead.age] ? lead.age : '3–4';
  const sc = lead.scores || {};
  DOMAIN_ORDER.forEach(function(d){ if(typeof sc[d] !== 'number') sc[d] = 60; });
  const rawWeak = Array.isArray(lead.weak) ? lead.weak : [];
  const mark = rawWeak.filter(function(x){ return String(x).indexOf('plan:') === 0; })[0];
  const wk = rawWeak.filter(function(x){ return String(x).indexOf('plan:') !== 0; });
  const dur = (mark && !adminDurTouched) ? mark.slice(5) : adminDuration;
  const html = buildPlanDoc({
    age: age, scores: sc, weak: wk,
    duration: dur, full: true, name: lead.name, child: lead.child,
    contact: CONTACTS[adminContactKey()].show
  });
  const slug = String(lead.child || lead.name || '').replace(/[əƏ]/g,'e').replace(/[ıI]/g,'i').replace(/İ/g,'I').replace(/[öÖ]/g,'o').replace(/[üÜ]/g,'u').replace(/[çÇ]/g,'c').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  const fname = 'UsaqIQ-' + (slug ? slug + '-' : '') + (dur === 'month' ? 'Ayliq' : 'Heftelik') + '-Plan.html';
  const file = new File([html], fname, { type: 'text/html' });
  const greet = 'Salam, ' + lead.name + '! UşaqIQ testinin nəticələrinə əsasən ' + (lead.child ? lead.child + ' üçün ' : 'uşağınız üçün ') + 'hazırlanmış inkişaf planı əlavə olunub.';
  let shared = false;
  try {
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], text: greet });
      shared = true;
    }
  } catch(e){
    if(e && e.name === 'AbortError') return;
  }
  if(!shared){
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    window.open('https://wa.me/' + lead.phone + '?text=' + encodeURIComponent(greet), '_blank', 'noopener');
    adminToast('Fayl yükləndi. WhatsApp-da skrepka ilə əlavə edin.');
  }
  try { await window.uiqLeads.setStatus(lead.id, 'sent'); lead.status = 'sent'; renderAdminList(); } catch(e){ adminToast('Status yenilənmədi.'); }
}

function leadCard(lead){

  const sent = lead.status === 'sent';
  top.appendChild(el('span', 'font-size:.72rem; font-weight:800; padding:4px 8px; border-radius:8px; white-space:nowrap; background:' + (sent ? '#e8f7ee' : '#fff4e0') + '; color:' + (sent ? '#166534' : '#9a5b00') + ';', sent ? 'göndərilib' : 'gözləyir'));
  card.appendChild(top);
  const when = lead.createdAt ? new Date(lead.createdAt).toLocaleString('az-AZ') : '';
  card.appendChild(el('div', 'font-size:.8rem; color:#667085; font-weight:700; margin:4px 0 8px;', '+' + lead.phone + ' · yaş: ' + (lead.age || '—') + (when ? ' · ' + when : '')));
  if(lead.scores){
    DOMAIN_ORDER.forEach(function(d){
      const v = Math.max(0, Math.min(100, Number(lead.scores[d]) || 0));
      const row = el('div', 'display:flex; align-items:center; gap:8px; font-size:.74rem; font-weight:700; margin-bottom:3px;');
      row.appendChild(el('span', 'width:110px; flex:none;', d));

      bar.appendChild(el('div', 'height:100%; width:' + v + '%; background:' + (v < 60 ? '#dc2626' : '#2A9D8F') + ';'));
      row.appendChild(bar);
      row.appendChild(el('span', 'width:34px; text-align:right;', v + '%'));
      card.appendChild(row);
    });
  }
  const acts = el('div', 'display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;');
  acts.appendChild(adminBtn('📤 Planı göndər', '#16a34a', '#fff', function(){ sendLeadPlan(lead); }));

  call.href = 'tel:+' + lead.phone;
  acts.appendChild(call);
  if(sent) acts.appendChild(adminBtn('↩ Gözləyənə qaytar', '#f3f4f6', '#20232a', async function(){
    try { await window.uiqLeads.setStatus(lead.id, 'new'); lead.status = 'new'; renderAdminList(); } catch(e){ adminToast('Alınmadı.'); }
  }));
  acts.appendChild(adminBtn('🗑', '#fee2e2', '#b91c1c', async function(){
    if(!confirm('Bu müraciət silinsin?')) return;
    try { await window.uiqLeads.remove(lead.id); adminLeads = adminLeads.filter(function(x){ return x.id !== lead.id; }); renderAdminList(); } catch(e){ adminToast('Silinmədi.'); }
  }));
  card.appendChild(acts);
  return card;
}

function getMax(key){
  const td = currentTierData();
  if(key==='soz') return td.words.length;
  if(key==='hiss') return td.emotions.length;
  if(key==='yaddas') return td.memory.length*2;
  if(key==='seher') return td.sequences.reduce((s,seq)=>s+seq.length,0);
  if(key==='cumle') return td.cumle.length;

  return null;
}

let __qTimerInterval = null;
function armQuestionTimer(expireCallback){
  clearInterval(__qTimerInterval);
  const td = currentTierData();
  if(!td.timed) return;
  const totalTenths = td.timerSeconds*10;
  let remaining = totalTenths;
  __qTimerInterval = setInterval(()=>{
    remaining--;
    const fill = document.getElementById('qtimerFill');
    if(fill) fill.style.width = Math.max(0,(remaining/totalTenths*100))+'%';
    if(remaining<=0){ clearInterval(__qTimerInterval); expireCallback(); }
  }, 100);
}
function disarmQuestionTimer(){ clearInterval(__qTimerInterval); }

const TIER_EMOJI = {toddler:'🎨', core:'🧸', advanced:'🔤'};
function renderHome(){
  const d = document.createElement('div');
  d.innerHTML = `<h1 class="hub-title">🎮 Oyun Mərkəzi</h1>
  <p class="hub-sub">Yaş qrupunu seç, oyunlar ona uyğunlaşacaq</p>
  <div class="tier-sq-grid" id="tierRow"></div>
  <div class="game-sq-grid" id="gameGrid" style="margin-top:22px;"></div>`;

  const tierRow = d.querySelector('#tierRow');
  Object.entries(TIER_DATA).forEach(([tk,td])=>{
    const b = document.createElement('div');
    b.className = 'tier-square'+(gameTier===tk?' active':'');
    b.onclick = ()=>{ gameTier=tk; gameTierManual=true; renderGamesApp(); };
    b.innerHTML = `<div class="thumb">${e3d(TIER_EMOJI[tk],tk.length,44)}</div><div class="lbl">${td.label}</div>`;
    tierRow.appendChild(b);
  });

  const grid = d.querySelector('#gameGrid');
  Object.entries(GAMES).forEach(([key,g])=>{
    const max = getMax(key);
    const card = document.createElement('div');
    card.className='game-square';
    card.onclick = ()=>startGame(key);
    card.innerHTML = `<div class="thumb" style="background:${g.color};">${e3d(g.ic,DOMAIN_ORDER.indexOf(g.domain),52)}</div>
      <div class="lbl">${g.title}<span class="domain-tag">${g.domain}</span></div>
      <div class="best">🏆 ${tierGetBest(key)}${max?'/'+max:''}</div>`;
    grid.appendChild(card);
  });
  return d;
}

function startGame(key){
  score = 0;
  if(key==='soz') startWordGame();
  else if(key==='balon') startBalloonGame();
  else if(key==='yaddas') startMemoryGame();
  else if(key==='hiss') startEmotionGame();
  else if(key==='seher') startSeqGame();

function spawnBalloon(area){

  const areaH = area.clientHeight || 320;
  const b = document.createElement('div');

  b.onclick = ()=>{ score++; document.querySelectorAll('.score-pill').forEach(p=>p.innerText='⭐ '+score); b.remove(); };

let memCards=[], memFlipped=[], memMoves=0, memMatched=0, memPairCount=6;
function startMemoryGame(){
  const set = currentTierData().memory;
  memPairCount = set.length;
  const pairs = shuffle([...set, ...set]).map((e,i)=>({id:i, e, flipped:false, matched:false}));
  memCards = pairs; memFlipped=[]; memMoves=0; memMatched=0;
  gameView='yaddas-play'; renderGamesApp();
}
function renderMemoryGame(){
  const d=document.createElement('div');
  d.innerHTML = `<div class="mem-hud"><span>🔄 Hərəkət: ${memMoves}</span><span>✅ ${memMatched}/${memPairCount}</span></div>
  <div class="memory-grid" id="memGrid">
    ${memCards.map(c=>`<div class="mem-card ${c.flipped?'flipped':''} ${c.matched?'matched':''}" onclick="flipCard(${c.id})">${c.flipped||c.matched?c.e:'❓'}</div>`).join('')}
  </div>`;
  return d;
}
function flipCard(id){
  const card = memCards.find(c=>c.id===id);
  if(card.flipped || card.matched || memFlipped.length>=2) return;
  card.flipped = true; memFlipped.push(card);
  renderGamesApp();
  if(memFlipped.length===2){
    memMoves++;
    if(memFlipped[0].e === memFlipped[1].e){
      memFlipped.forEach(c=>c.matched=true);
      memMatched++;
      memFlipped=[];
      if(memMatched===memPairCount){
        score = Math.max(0, memPairCount*4 - memMoves*2);
        setTimeout(()=>{ tierSetBest('yaddas',score); gameView='yaddas-end'; renderGamesApp(); }, 500);
      } else { renderGamesApp(); }
    } else {
      setTimeout(()=>{ memFlipped.forEach(c=>c.flipped=false); memFlipped=[]; renderGamesApp(); }, 800);
    }
  }
}

    if(i===targetIdx){

    } else {
      cell.innerText = cfg.decoys[Math.floor(Math.random()*cfg.decoys.length)];
    }
    grid.appendChild(cell);
  }
  clearTimeout(teztapTimer);
  teztapTimer = setTimeout(()=>{ teztapMisses++; advanceMoleRound(); }, cfg.duration);
}
function advanceMoleRound(){
  teztapRound++;

let seqRound=0, seqCurrent=[], seqPlaced=[], seqTiles=[], seqMistakes=0;
function startSeqGame(){ seqRound=0; seqMistakes=0; nextSequence(); gameView='seher-play'; renderGamesApp(); }
function nextSequence(){
  const seqs = currentTierData().sequences;
  seqCurrent = seqs[seqRound % seqs.length];
  seqPlaced = [];
  seqTiles = shuffle(seqCurrent.map((s,i)=>({...s, origIdx:i, used:false})));
}
function renderSeqGame(){
  const seqs = currentTierData().sequences;
  const d=document.createElement('div');
  d.innerHTML = `<div class="round-lbl">Ardıcıllıq ${seqRound+1}/${seqs.length} — düzgün sırayla toxun ${seqMistakes?`· ❌ ${seqMistakes} səhv`:''}</div>
  <div class="seq-target" id="seqTarget">
    ${seqCurrent.map((s,i)=>`<div class="seq-slot ${seqPlaced[i]?'filled':''}">${seqPlaced[i]?seqPlaced[i].ic:''}</div>`).join('')}
  </div>
  <div class="seq-pool" id="seqPool">
    ${seqTiles.map((t,i)=>`<div class="seq-tile ${t.used?'used':''}" onclick="tapSeq(${i})"><span class="e">${t.ic}</span><span>${t.label}</span></div>`).join('')}
  </div>`;
  return d;
}
function tapSeq(idx){
  const tile = seqTiles[idx];
  if(tile.used) return;
  const nextExpected = seqPlaced.length;
  if(tile.origIdx === nextExpected){
    tile.used = true;
    seqPlaced.push(tile);
    score++;
    if(seqPlaced.length === seqCurrent.length){
      setTimeout(()=>{
        seqRound++;
        const seqs = currentTierData().sequences;
        if(seqRound >= seqs.length){
          score = Math.max(0, score - seqMistakes);
          tierSetBest('seher',score); gameView='seher-end'; renderGamesApp();
        }
        else { nextSequence(); renderGamesApp(); }
      }, 700);
    }
  } else {
    seqMistakes++;
    const el = document.querySelectorAll('#seqPool .seq-tile')[idx];
    if(el){ el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'), 300); }
  }
  renderGamesApp();
}

function svgTag(region, fillOverride){
  const attrs = region.attrs;
  const attrStr = Object.entries(attrs).map(([k,v])=>`${k}="${v}"`).join(' ');
  const fill = fillOverride || coloringFills[region.id] || '#fdf6ec';
  const clickable = fillOverride ? '' : `onclick="fillColoringRegion('${region.id}')" class="color-region"`;
  return `<${region.tag} ${attrStr} fill="${fill}" stroke="#2b2118" stroke-width="3" ${clickable}></${region.tag}>`;
}

function openColoringTemplate(idx){
  coloringTemplateIdx = idx;
  coloringFills = {};
  coloringView = 'draw';
  renderColoringApp();
}
function coloringBackToGallery(){ coloringView='gallery'; renderColoringApp(); }

function renderColoringCanvas(){
  const tpl = COLORING_TEMPLATES[coloringTemplateIdx];
  const d=document.createElement('div');
  d.innerHTML = `<h2 style="text-align:center; font-size:1.15rem; margin-bottom:6px;">${tpl.name}</h2>
  <div class="palette-row" id="paletteRow"></div>
  <div class="coloring-stage">
    <svg viewBox="${tpl.viewBox}" id="colSvg">${tpl.regions.map(r=>svgTag(r)).join('')}</svg>
  </div>
  <div style="display:flex; gap:10px;">
    <button class="big-btn outline" style="flex:1;" onclick="resetColoringTemplate()">🔄 Təmizlə</button>
    <button class="big-btn" style="flex:1;" onclick="coloringBackToGallery()">✅ Bitdi</button>
  </div>`;
  const paletteRow = d.querySelector('#paletteRow');
  PALETTE.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = 'swatch'+(coloringColor===c?' active':'');
    sw.style.background = c;
    if(c==='#ffffff') sw.style.border = coloringColor===c ? '3px solid var(--ink)' : '2px solid #ccc';
    sw.onclick = ()=>{ coloringColor=c; renderColoringApp(); };
    paletteRow.appendChild(sw);
  });
  return d;
}

function fillColoringRegion(id){
  coloringFills[id] = coloringColor;
  const el = document.querySelector(`#colSvg [onclick*="${id}'"]`);
  if(el) el.setAttribute('fill', coloringColor);
}
function resetColoringTemplate(){ coloringFills = {}; renderColoringApp(); }

render();
</script>
